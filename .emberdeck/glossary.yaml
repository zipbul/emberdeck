- word: 4-tier
  definition: >-
    Strict card hierarchy of principle/domain/brief/spec where principle and
    domain are roots, brief parents must be domain, and spec parents must be
    brief or spec.
- word: activation-guard
  definition: >-
    Validation barrier preventing a card from transitioning to active until all
    required fields and (for specs) source `@spec` bindings resolve; enforced by
    status transition logic.
- word: card-key
  definition: >-
    Hierarchical card identifier in `namespace/slug` format that locates a card
    in storage and encodes its parent namespace.
- word: codeLink
  definition: >-
    A row in the DB `code_link` cache binding a card key to a code symbol (file
    plus symbol name). Populated from source `@spec` JSDoc annotations by `ed
    spec sync`; never declared on the card itself.
- word: drift
  definition: >-
    Divergence between card claims and current code or glossary state,
    classified into `broken_link` and `glossary_broken` driftTypes that drive
    auto status transitions.
- word: gildash
  definition: >-
    External code-index dependency that supplies symbol, file, and import facts
    to emberdeck and is the single source of truth for code-side data.
- word: json-envelope
  definition: >-
    Legacy v1 CLI output envelope (schemaVersion, status, data, warnings, errors
    fields) — removed by the envelope-removal redesign. v2 commands emit their
    natural per-command JSON shape on stdout with stderr JSON-line diagnostics.
    Term retained as the historical reference used by command spec cards under
    cli-surface/command-routing-and-output/commands/.
- word: single-file-rule
  definition: >-
    Card authoring rule: an invariant becomes a card only when verifying it
    requires reading more than one source file; single-file invariants stay in
    code.
- word: single-process
  definition: >-
    The invocation model ed CLI assumes: one process at a time, no cross-process
    lock or retry; safe-write compensation relies on this assumption.
- word: spec-annotation
  definition: >-
    A `/** @spec card-key */` JSDoc tag in source code declaring that the
    annotated function/class/variable participates in the named card's contract.
    Source-as-SoT: this annotation is the only way bindings are declared.
